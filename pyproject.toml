[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlm"
version = "0.1.0"
description = "TLM -- task-conditioned encoder-decoder for source-code edits"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "orjson>=3.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "datasets>=4.8",
]

[project.optional-dependencies]
codet5 = ["transformers>=4.44"]      # CodeT5 baseline notebooks
tracking = ["wandb>=0.17"]           # optional experiment logging

[tool.setuptools.packages.find]
include = ["src*"]
